<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/greenhands-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable app: opened from the home screen it runs full screen, with no browser bar -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand-apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GreenHands BC" />
    <!-- "default": dark clock on a light bar. black-translucent would force a white clock, unreadable in light mode -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Status bar colour; lib/theme.ts overwrites both when someone picks Light or Dark -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111112" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet" />
    <title>GreenHands BC</title>
  </head>
  <body>
    <div id="startup-screen" role="status" aria-label="Loading GreenHands BC">
      <img src="/greenhands-logo.png" alt="" />
      <span>GreenHands BC</span>
    </div>
    <style>
      #startup-screen { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #fff; color: #092c47; font: 700 20px system-ui, sans-serif; transition: opacity 180ms ease; }
      #startup-screen img { width: 140px; height: 140px; object-fit: contain; }
      #startup-screen.is-done { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #startup-screen { transition: none; } }
    </style>
    <script>
      window.setTimeout(function () {
        var screen = document.getElementById('startup-screen');
        if (screen) { screen.classList.add('is-done'); window.setTimeout(function () { screen.remove(); }, 200); }
      }, 1000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
